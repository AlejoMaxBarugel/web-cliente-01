<!DOCTYPE html>

<style>
:root{--bg:#0e1116;--bg2:#161b22;--ink:#f3f5f7;--muted:#9aa7b4;--line:#2a3441;--acc:#ffb800;--wa:#1faa59}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6f8;--bg2:#e9edf1;--ink:#12202e;--muted:#566677;--line:#d5dce3}}
:root[data-theme="light"]{--bg:#f4f6f8;--bg2:#e9edf1;--ink:#12202e;--muted:#566677;--line:#d5dce3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Barlow,system-ui,sans-serif;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
main{max-width:520px;text-align:center}
.code{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(6rem,30vw,10rem);line-height:.9;color:var(--acc)}
h1{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1;margin:12px 0}
p{color:var(--muted);margin:0 0 28px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:6px;font-weight:600;border:2px solid transparent;text-decoration:none;color:inherit}
.b1{background:var(--acc);color:#111}
.b2{border-color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
small{display:block;margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

</html>
